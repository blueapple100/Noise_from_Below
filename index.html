<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>팀 아랫집 정식 가계도</title>
    <style>/
        body { 
            margin: 0; 
            padding: 0; 
            font-family: sans-serif; 
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%); 
            min-height: 100vh;
            overflow-x: auto; 
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
        }

        header { padding: 20px; background: linear-gradient(to right, #000000, #444444); display: flex; align-items: center; position: relative; z-index: 10; }
        #logo { height: 60px; margin-right: 20px; }
        .menu-text { color: white; font-size: 20px; font-weight: bold; }

        #tree-container {
            position: relative;
            width: 1600px; 
            height: 800px; 
            margin: 0 auto;
            padding-top: 50px;
        }


        #connection-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .person-box {
            position: absolute;
            width: 150px;
            border: 4px solid white;
            border-radius: 15px;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            background: white;
        }
        .person-box:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 12px rgba(0,0,0,0.2);
        }
        .person-box img { width: 100%; height: 140px; object-fit: cover; }
        .person-box .name-tag { padding: 10px; font-weight: bold; color: #333; font-size: 15px; text-align: center; width: 100%; box-sizing: border-box; }
        .person-box .title-tag { font-size: 12px; color: #666; margin-bottom: -5px; display: block; }

        /* 모달 스타일 (이전과 동일) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; display: flex; gap: 20px; width: 80%; max-width: 600px; }
        .modal-img { width: 200px; height: 200px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
        .modal-text-area { max-height: 300px; overflow-y: auto; padding-right: 10px; }
        #modal-desc { line-height: 1.6; color: #444; margin-top: 10px; }
        .read-more-btn { display: inline-block; margin-top: 5px; color: blue; cursor: pointer; font-size: 14px; text-decoration: underline; }
    </style>
</head>
<body>

<header>
    <img src="로고.png" id="logo" alt="Logo">
    <div class="menu-text">팀 아랫집 공식 패밀리 트리</div>
</header>

<div id="tree-container">
    <!-- 연결선이 그려질 SVG 영역 -->
    <svg id="connection-lines"></svg>
    
    <!-- 멤버 박스들이 동적으로 여기에 추가됩니다 -->
</div>

<!-- 모달 창 -->
<div id="modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <img id="modal-img" class="modal-img" src="" alt="Member">
        <div class="modal-text-area">
            <h2 id="modal-name" style="margin-top:0;"></h2>
            <p id="modal-desc"></p>
            <a id="modal-youtube" href="#" target="_blank" style="font-weight:bold; color:#ff0000; display:inline-block; margin-top:10px;">유튜브 채널 바로가기</a>
        </div>
    </div>
</div>

<script>
    const members = [
        { id: "독새", title: "(아빠)", name: "독새", color: "#808080", img: "독새.png", yt: "https://www.youtube.com/@%EB%8F%85%EC%83%88", desc: "[ 아빠 ]...", x: 600, y: 50 },
        { id: "이배일", title: "(엄마)", name: "이배일", color: "#FFC0CB", img: "로고.png", yt: "#", desc: "[ 엄마 ]...", x: 800, y: 50 },
        
        { id: "윈티", title: "(차남)", name: "윈티", color: "#FFB6C1", img: "윈티.png", yt: "https://www.youtube.com/@%EC%9C%88%ED%8B%B0", desc: "[ 차남 ]...", x: 150, y: 250 },
        { id: "문장준", title: "(장남)", name: "문장준", color: "#FF0000", img: "문장준.jpeg", yt: "https://www.youtube.com/@%EB%AC%B8%EC%9E%A5%EC%A4%80_09", desc: "[ 장남 ]...", x: 400, y: 250 },
        { id: "블파재오", title: "(4남)", name: "블애, 파곰, 재켄, 오드", color: "#87CEEB", img: "로고.png", yt: "#", desc: "[ 4남 ]...", x: 650, y: 250 },
        { id: "막내들", title: "(막내 아들 / 막내 딸)", name: "고스 / 김설띠", color: "#D8BFD8", img: "로고.png", yt: "#", desc: "[ 막내즈 ]...", x: 1250, y: 250 },
        
        { id: "탈두", title: "(애완 두부)", name: "탈두", color: "#FFFF00", img: "탈두.png", yt: "https://www.youtube.com/@TALDUDA", desc: "[ 집나간 새끼 ]...", x: 650, y: 550 }
    ];

    const connections = [
        { parent1: "독새", parent2: "이배일", children: ["윈티", "문장준", "블파재오", "막내들"], type: "horizontal" }, 
        { parent1: "블파재오", children: ["탈두"], type: "vertical" } /
    ];

    const container = document.getElementById('tree-container');
    const svg = document.getElementById('connection-lines');
    const BOX_WIDTH = 150;
    const BOX_HEIGHT = 200;
    const LINE_COLOR = "#000000";
    const LINE_THICKNESS = 3;


    members.forEach(m => {
        const box = document.createElement('div');
        box.className = 'person-box';
        box.id = `box-${m.id}`;
        box.style.left = `${m.x}px`;
        box.style.top = `${m.y}px`;
        box.style.background = `linear-gradient(to bottom, ${m.color}, #ffffff)`;
        box.innerHTML = `<img src="${m.img}" alt="${m.name}"><div class="name-tag"><span class="title-tag">${m.title}</span>${m.name}</div>`;
        box.onclick = () => openModal(m);
        container.appendChild(box);
    });

    function drawLines() {
        svg.innerHTML = ''; 

        connections.forEach(conn => {
            if (conn.type === "horizontal") {
                const p1 = members.find(m => m.id === conn.parent1);
                const p2 = members.find(m => m.id === conn.parent2);
                
                const p1Right = p1.x + BOX_WIDTH;
                const p2Left = p2.x;
                const midY = p1.y + BOX_HEIGHT / 2;

                drawLine(p1Right, midY, p2Left, midY);

                const vLineX = (p1Right + p2Left) / 2;
                const vLineYTop = midY;
                const vLineYBottom = p1.y + BOX_HEIGHT + 20;

                drawLine(vLineX, vLineYTop, vLineX, vLineYBottom);

                // 자녀 메인 수평선 (모든 자녀 그룹을 연결)
                const childrenBoxes = conn.children.map(id => members.find(m => m.id === id));
                const firstChildX = Math.min(...childrenBoxes.map(c => c.x)) + BOX_WIDTH / 2;
                const lastChildX = Math.max(...childrenBoxes.map(c => c.x)) + BOX_WIDTH / 2;
                
                drawLine(firstChildX, vLineYBottom, lastChildX, vLineYBottom);

                // 각 자녀 그룹에서 메인 수평선으로 올리는 수직선
                conn.children.forEach(childId => {
                    const child = members.find(m => m.id === childId);
                    drawLine(child.x + BOX_WIDTH/2, child.y, child.x + BOX_WIDTH/2, vLineYBottom);
                });

            } else if (conn.type === "vertical") {
                // [4남] 아래로 [탈두] 연결 (수직)
                const parent = members.find(m => m.id === conn.parent1);
                
                conn.children.forEach(childId => {
                    const child = members.find(m => m.id === childId);
                    // 부모 박스 중앙 아래에서 자녀 박스 중앙 위로
                    drawLine(parent.x + BOX_WIDTH/2, parent.y + BOX_HEIGHT, child.x + BOX_WIDTH/2, child.y);
                });
            }
        });
    }

    // SVG에 선을 그리는 헬퍼 함수
    function drawLine(x1, y1, x2, y2) {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x1);
        line.setAttribute("y1", y1);
        line.setAttribute("x2", x2);
        line.setAttribute("y2", y2);
        line.setAttribute("stroke", LINE_COLOR);
        line.setAttribute("stroke-width", LINE_THICKNESS);
        svg.appendChild(line);
    }

    // 화면 크기 변경 시 선 다시 그리기 (반응형 대응)
    window.addEventListener('resize', drawLines);
    // 초기 선 그리기
    drawLines();

    // 모달 관련 함수 (이전과 동일)
    function openModal(m) {
        document.getElementById('modal-img').src = m.img;
        document.getElementById('modal-name').innerText = m.name; 
        
        const descElem = document.getElementById('modal-desc');
        if (m.id === "재켄") { 
            descElem.innerHTML = m.shortDesc + 
                '<span id="more-text" style="display:none;">' + m.longDesc + '</span>' +
                '<br><span class="read-more-btn" onclick="showFull()">...더보기</span>';
        } else if (m.id === "블파재오") {
             descElem.innerHTML = "블애, 파곰, 재켄, 오드 멤버들의 상세 설명이 들어갈 자리입니다.";
        } else if (m.id === "막내들") {
             descElem.innerHTML = "고스, 김설띠 멤버들의 상세 설명이 들어갈 자리입니다.";
        } else {
            descElem.innerHTML = m.desc;
        }
        
        document.getElementById('modal-youtube').href = m.yt;
        document.getElementById('modal').style.display = 'flex';
    }

    function showFull() {
        document.getElementById('more-text').style.display = 'inline';
        document.querySelector('.read-more-btn').style.display = 'none';
    }

    function closeModal() { 
        document.getElementById('modal').style.display = 'none'; 
    }

    // 우클릭, 드래그 방지
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
</script>

</body>
</html>
