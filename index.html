<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>팀 아랫집에서 올라왔어요!!!!!!</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%); min-height: 100vh; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        header { padding: 20px; background: linear-gradient(to right, #000000, #444444); display: flex; align-items: center; }
        #logo { height: 80px; margin-right: 20px; }
        .menu-text { color: white; font-size: 24px; font-weight: bold; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; display: flex; gap: 20px; width: 80%; max-width: 600px; }
        .modal-img { width: 200px; height: 200px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
        .modal-text-area { max-height: 250px; overflow-y: auto; padding-right: 10px; }
        .read-more-btn { display: inline-block; margin-top: 5px; color: blue; cursor: pointer; font-size: 14px; text-decoration: underline; }

        .tree-section { max-width: 1300px; margin: 60px auto; padding: 0 30px; }

        .tree-card { display: flex; flex-direction: column; align-items: center; padding: 8px 8px 10px; border-radius: 14px; border: 3px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.15); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; background: white; z-index: 2; }
        .tree-card:hover { transform: scale(1.06); box-shadow: 0 8px 14px rgba(0,0,0,0.22); }
        .tree-card img { width: 110px; height: 110px; object-fit: cover; border-radius: 10px; display: block; }
        .tree-card span { margin-top: 6px; font-weight: bold; color: #222; }
        .tree-card.sm img { width: 78px; height: 78px; }
        .tree-card.sm span { font-size: 13px; margin-top: 4px; }
        .tree-card.parent img { width: 130px; height: 130px; }

        .tree-parents { display: flex; align-items: center; justify-content: center; gap: 0; }
        .tree-hline { width: 60px; height: 5px; background: #111; }

        .tree-vline-drop { width: 5px; height: 40px; background: #111; margin: 0 auto; }

        .tree-children-wrap { position: relative; padding-top: 40px; }
        
        .tree-children-hline { 
            position: absolute; 
            top: 40px; 
            left: calc(100% / 18); 
            right: calc(100% / 18); 
            height: 5px; 
            background: #111; 
            z-index: 1; 
        }

        .tree-children { display: flex; align-items: flex-start; justify-content: space-between; padding-top: 40px; position: relative; }

        .tree-slot { position: relative; display: flex; justify-content: center; flex: 1; }
        .tree-slot::before { content: ''; position: absolute; top: -40px; left: 50%; width: 5px; height: 40px; background: #111; transform: translateX(-50%); z-index: 1; }

        .tree-hub-slot { flex: 2.6; }
        .tree-hub { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .hub-drop { width: 5px; height: 30px; background: #111; }
        .hub-wrap { position: relative; padding-top: 30px; width: 100%; }
        
        .hub-hline { 
            position: absolute; 
            top: 30px; 
            left: 12%; 
            right: 12%; 
            height: 5px; 
            background: #111; 
            z-index: 1; 
        }

        .hub-row { display: flex; justify-content: space-between; padding-top: 30px; position: relative; }
        .hub-item { position: relative; display: flex; justify-content: center; flex: 1; }
        .hub-item::before { content: ''; position: absolute; top: -30px; left: 50%; width: 5px; height: 30px; background: #111; transform: translateX(-50%); z-index: 1; }
    </style>
</head>
<body>

        { name: "블애", color: "#6A5ACD", img: "블애.png", yt: "https://www.youtube.com/@NOT_BLAE", desc: "[ 삼남 ]<br>블애는 사과사과왕국에서 태어난 파란사과 가문 왕자지만 과수원에서 독새에게 수확당해 독새의 집에서 길러졌다." },
        { name: "파곰", color: "#87CEEB", img: "파곰.png", yt: "https://www.youtube.com/@%EA%B9%80%ED%8C%8C%EA%B3%B0", desc: "[ 사남 ] 그자는 언급해서는 안된다. 그래서 개별 문서로 작성을 한다. 이 파곰이라는 개체는 뱃살을 바닥으로 쳐서 상대방을 날려버리며 레그돌 시킨 상대를 바로 손으로 잡아 먹어버린다. 그 중 독새가 있었고 독새는 그때 방구를 뀐 탓에 괴수 상태가 풀려 곰상태로 동굴에 들어가 645일동안 쑥과 마늘을 먹어 인간이 되어 독새와 함께하고있다." },
        { name: "재켄", color: "#90EE90", img: "재켄.png", yt: "https://www.youtube.com/@%EC%9D%BC%EB%A1%9C%EC%99%80%EB%B3%B4%EC%9D%B4", shortDesc: "[ 오남 ]<br>막시무스를 길들인자로서 엉덩이가 크다. 그래서 엉덩이가 크며 엉덩이가 크다. 엉덩이가 큰건 사실...<br>L: 아랫집, 그림 그리기랑 그림 구경하기, 게임, 게임 개발, 운동, 🤓",
          longDesc: ", 샌즈, 파피루스, 언더펠 샌즈, 언더스왑 샌즈, 스왑펠 샌즈, 펠스왑 샌즈, 아우터테일 샌즈, 아우터펠 샌즈, 아우터스왑 샌즈, 스토리시프트 샌즈, 스토리스핀 샌즈, 더스트 샌즈, 호러 샌즈, 킬러 샌즈, 잉크 샌즈, 에러 샌즈, 페이탈 에러 샌즈, 제노 샌즈, 프레쉬 샌즈, 드림 샌즈, 나이트메어 샌즈, 크로스 샌즈, 에픽 샌즈, 리퍼 샌즈, 하드테일 샌즈, 라스트 브레스 샌즈, 서든 체인지 샌즈, 인세니티 샌즈, 네거테일 샌즈, 네거티브테일 샌즈, 언더월드 샌즈, 호러스왑 샌즈, 호러펠 샌즈, 더스트펠 샌즈, 더스트스왑 샌즈, 더스트더스트 샌즈, 스왑스왑 샌즈, 리버트스왑 샌즈, 펠펠 샌즈, 리버트펠 샌즈, 드림스왑 샌즈, 블루베리 샌즈, 블루베러 샌즈, 에러 404 샌즈, 프레쉬 잉크 샌즈, 델타 샌즈, 퀀텀테일 샌즈, 트레이너테일 샌즈, 디스트러스트 샌즈, 더스트트러스트 샌즈, 티라노사우루스, 트리케라톱스, 벨로키랍토르, 스피노사우루스, 스테고사우루스, 브라키오사우루스, 아파토사우루스, 디플로도쿠스, 알로사우루스, 카르노타우루스, 기가노토사우루스, 안킬로사우루스, 파라사우롤로푸스, 이구아노돈, 파키케팔로사우루스, 갈리미무스, 데이노니쿠스, 유타랍토르, 알베르토사우루스, 타르보사우루스, 케라토사우루스, 딜로포사우루스, 바리오닉스, 수코미무스, 아크로칸토사우루스, 카르카로돈토사우루스, 마푸사우루스, 메갈로사우루스, 코엘로피시스, 콤프소그나투스, 오비랍토르, 테리지노사우루스, 데이노케이루스, 오르니토미무스, 에드몬토사우루스, 코리토사우루스, 람베오사우루스, 마이아사우라, 카스모사우루스, 스티라코사우루스, 프로토케라톱스, 프시타코사우루스, 켄트로사우루스, 아마르가사우루스, 아르헨티노사우루스, 파타고티탄, 살타사우루스, 마멘키사우루스, 카마라사우루스, 노도사우루스, 하츄핑, 바로핑, 아자핑, 차차핑, 라라핑, 해핑, 키키핑, 아잉핑, 부끄핑, 깜빡핑, 띠용핑, 주르핑, 차나핑, 따라핑, 나르핑, 무셔핑, 투투핑, 떠벌핑, 다조핑, 화나핑, 시러핑, 바네핑, 덜덜핑, 그림핑, 무거핑, 꺼꿀핑, 씽씽핑, 베베핑, 코자핑, 딱풀핑, 모야핑, 토이핑, 또까핑, 플라핑, 노라핑, 노리핑, 아휴핑, 똑똑핑, 꽁꽁핑, 찌릿핑, 홀로핑, 악동핑, 믿어핑, 방글핑, 조아핑, 토닥핑, 까르핑, 아야핑, 소원핑, 쪼꼼핑, 싹싹핑, 맛나핑, 포근핑, 메모핑, 공쥬핑, 짝짝핑, 주네핑, 뚝딱핑, 발레핑, 원더핑, 보석핑, 솔찌핑, 나나핑, 꾸래핑, 행운핑, 빨리핑, 얌얌핑, 뜨거핑, 삐뽀핑, 힘내핑, 고쳐핑, 아라핑, 패션핑, 꼼딱핑, 퐁당핑, 파티핑, 꾸며핑, 삐짐핑, 아아핑, 빙글핑, 하늘핑, 고고핑, 아롱핑, 다롱핑, 샤샤핑, 말랑핑, 포실핑, 새콤핑, 달콤핑, 캔디핑, 머랭핑, 샌드핑, 또너핑, 와플핑, 마카핑, 핫케핑, 머핑, 커핑, 요거핑, 눈꽃핑, 푸딩핑, 멜로핑, 쪼꼬핑, 뿌뿌핑, 빤짝핑, 초롱핑, 빛나핑, 오로라핑, 왕자핑, 뽀뽀핑, 유리핑, 딩동핑, 나그네핑, 댄스핑, 고마핑, 함께핑, 깡총핑, 훌라핑, 나눔핑, 루루핑, 몰래핑, 뿌쵸핑, 여우핑, 뽀송핑, 통통핑,<br>H: 탈두의 12번째 척추뼈."
        },
        { name: "오드", color: "#FFA500", img: "오드.png", yt: "https://www.youtube.com/@fake_od", desc: "[ 육남 ]<br>오랜지 드래곤이다. 중세시대에 태어났으며 사과 블애를 먹을려다가 왕국의 권위자 락커룸의 제왕에게 제지당하였고 지금은 마력으로 인간으로 변해 독새를 잡아먹으려고 하고있다" },
        { name: "김설띠", color: "#D8BFD8", img: "김설띠.png", yt: "https://www.youtube.com/@Kimsultye0110", desc: "[ 장녀 ]<br>그는 통칭 :익스트림 데몬 스케리 김설띠: 라고 불리며 그의 멍칭에 걸맞은 위대한 압박감을 보여주며 락커룸의 제왕을 단숨에 때려눕혀 죽여버렸다. 그를 막을자는 없다." },
        { name: "고스", color: "#808080", img: "고스.png", yt: "https://www.youtube.com/@gos2017", desc: "[ 막내 ]<br>그냥 귀엽기때문이다. 그리하여 아무도 건들수 없지만 그라고 불리우는  :익스트림 데몬 스케리 김설띠:에게 놀림을 당하며 그때마다 독새가 막아준다" },
        { name: "탈두", color: "#FFFF00", img: "탈두.png", yt: "https://www.youtube.com/@TALDUDA", desc: "[ 집나간 새끼 ]<br>독새가 먹다가 살아있는 두부다. 독새를 아빠로 부르며 충성을 다짐하였지만 아빠가 로벅스를 결제 안해준다는 이유로 집을 나간 이후로 그에 대한 복수로 밖에 나가서 공부를 존나하고 있다." }
    ];

    const byName = (n) => members.find(m => m.name === n);
    const dad = byName("독새");
    const mom = byName("이배일");

    function makeCard(m, extraClass) {
        const el = document.createElement('div');
        el.className = 'tree-card' + (extraClass ? ' ' + extraClass : '');
        el.style.background = `linear-gradient(to bottom, ${m.color}, #ffffff)`;
        el.innerHTML = `<img src="${m.img}" alt="${m.name}"><span>${m.name}</span>`;
        el.onclick = () => openModal(m);
        return el;
    }

    function renderTree() {
        const section = document.getElementById('tree-section');
        section.innerHTML = '';

        const parentsRow = document.createElement('div');
        parentsRow.className = 'tree-parents';
        parentsRow.appendChild(makeCard(dad, 'parent'));
        const hline = document.createElement('div');
        hline.className = 'tree-hline';
        parentsRow.appendChild(hline);
        parentsRow.appendChild(makeCard(mom, 'parent'));
        section.appendChild(parentsRow);

        const drop = document.createElement('div');
        drop.className = 'tree-vline-drop';
        section.appendChild(drop);
        
        const wrap = document.createElement('div');
        wrap.className = 'tree-children-wrap';
        wrap.innerHTML = '<div class="tree-children-hline"></div>';
        
        const row = document.createElement('div');
        row.className = 'tree-children';

        const singleNames1 = ["문장준", "윈티"];
        const hubNames = ["블애", "파곰", "재켄", "오드"];
        const singleNames2 = ["김설띠", "고스", "탈두"];

        singleNames1.forEach(n => {
            const slot = document.createElement('div');
            slot.className = 'tree-slot';
            slot.appendChild(makeCard(byName(n)));
            row.appendChild(slot);
        });

        const hubSlot = document.createElement('div');
        hubSlot.className = 'tree-slot tree-hub-slot';
        const hub = document.createElement('div');
        hub.className = 'tree-hub';
        hub.innerHTML = '<div class="hub-drop"></div>';
        const hubWrap = document.createElement('div');
        hubWrap.className = 'hub-wrap';
        hubWrap.innerHTML = '<div class="hub-hline"></div>';
        const hubRow = document.createElement('div');
        hubRow.className = 'hub-row';
        hubNames.forEach(n => {
            const item = document.createElement('div');
            item.className = 'hub-item';
            item.appendChild(makeCard(byName(n), 'sm'));
            hubRow.appendChild(item);
        });
        hubWrap.appendChild(hubRow);
        hub.appendChild(hubWrap);
        hubSlot.appendChild(hub);
        row.appendChild(hubSlot);

        singleNames2.forEach(n => {
            const slot = document.createElement('div');
            slot.className = 'tree-slot';
            slot.appendChild(makeCard(byName(n)));
            row.appendChild(slot);
        });

        wrap.appendChild(row);
        section.appendChild(wrap);
    }
    renderTree();

    function openModal(m) {
        document.getElementById('modal-img').src = m.img;
        document.getElementById('modal-name').innerText = m.name;
        const descElem = document.getElementById('modal-desc');
        if (m.name === "재켄") {
            descElem.innerHTML = m.shortDesc + '<span id="more-text" style="display:none;">' + m.longDesc + '</span><br><span class="read-more-btn" onclick="showFull()">...더보기</span>';
        } else if (m.desc) {
            descElem.innerHTML = m.desc;
        } else {
            descElem.innerHTML = '';
        }
        const ytLink = document.getElementById('modal-youtube');
        if (m.yt) {
            ytLink.href = m.yt;
            ytLink.style.display = 'inline-block';
        } else {
            ytLink.style.display = 'none';
        }
        document.getElementById('modal').style.display = 'flex';
    }
    function showFull() { document.getElementById('more-text').style.display = 'inline'; document.querySelector('.read-more-btn').style.display = 'none'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
</script>
</body>
</html>
