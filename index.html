<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>팀 아랫집에서 올라왔어요!!!!!!</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%); min-height: 100vh; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        header { padding: 20px; background: linear-gradient(to right, #000000, #444444); display: flex; align-items: center; }
        #logo { height: 80px; margin-right: 20px; }
        .menu-text { color: white; font-size: 24px; font-weight: bold; }
      
        .container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; padding: 40px; max-width: 1200px; margin: 0 auto; }
        .member-btn { border: 4px solid white; padding: 0; border-radius: 15px; cursor: pointer; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .member-btn:hover { transform: scale(1.05); box-shadow: 0 8px 12px rgba(0,0,0,0.2); }
        .member-btn img { width: 100%; height: 180px; object-fit: cover; }
        .member-btn span { padding: 10px; font-weight: bold; color: #333; }

        #tree-section { max-width: 1200px; margin: 50px auto; padding: 20px; background: white; border-radius: 20px; position: relative; height: 600px; }
        .tree-box { position: absolute; width: 100px; height: 50px; border: 2px solid #333; display: flex; align-items: center; justify-content: center; background: #fff; font-size: 12px; font-weight: bold; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; display: flex; gap: 20px; width: 80%; max-width: 600px; }
        .modal-img { width: 200px; height: 200px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
        .modal-text-area { max-height: 250px; overflow-y: auto; padding-right: 10px; }
        .read-more-btn { display: inline-block; margin-top: 5px; color: blue; cursor: pointer; font-size: 14px; text-decoration: underline; }
    </style>
</head>
<body>
<header>
    <img src="로고.png" id="logo" alt="Logo">
    <div class="menu-text">민원이 안끊기는 볼륨 MAX 아랫집</div>
</header>

<div class="container" id="member-container"></div>

<div id="tree-section">
    <h3>아랫집 가계도</h3>
    <svg id="svg-lines" width="100%" height="500" style="position:absolute; top:80px; left:0;"></svg>
    <div class="tree-box" style="top:100px; left:450px;">독새</div>
    <div class="tree-box" style="top:100px; left:600px;">이배일</div>
    <div class="tree-box" style="top:300px; left:100px;">윈티</div>
    <div class="tree-box" style="top:300px; left:300px;">문장준</div>
    <div class="tree-box" style="top:300px; left:500px;">4남</div>
    <div class="tree-box" style="top:300px; left:700px;">막내</div>
</div>

<div id="modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <img id="modal-img" class="modal-img" src="" alt="Member">
        <div class="modal-text-area">
            <h2 id="modal-name" style="margin-top:0;"></h2>
            <p id="modal-desc"></p>
            <a id="modal-youtube" href="#" target="_blank" style="font-weight:bold; color:#ff0000; display:inline-block; margin-top:10px;">유튜브 채널 바로가기</a>
        </div>
    </div>
</div>

<script>
    const members = [
        { name: "독새", color: "#808080", img: "독새.png", yt: "https://www.youtube.com/@%EB%8F%85%EC%83%88", desc: "[ 아빠 ]<br>독새 채널의 주인이자 아랫집의 가장<br>폭주기관차 같은 텐션으로 모두를 이끈다" },
        { name: "문장준", color: "#FF0000", img: "문장준.jpeg", yt: "https://www.youtube.com/@%EB%AC%B8%EC%9E%A5%EC%A4%80_09", desc: "[ 장남 ]<br>유일하게 얼굴을 공개하고 있다" },
        { name: "윈티", color: "#FFB6C1", img: "윈티.png", yt: "https://www.youtube.com/@%EC%9C%88%ED%8B%B0", desc: "[ 차남 ]분홍색 머리에 하얀 후드티를 입고 있다." },
        { name: "블애", color: "#6A5ACD", img: "블애.png", yt: "https://www.youtube.com/@NOT_BLAE", desc: "[ 삼남 ] 블애입니다.!" },
        { name: "파곰", color: "#87CEEB", img: "파곰.png", yt: "https://www.youtube.com/@%EA%B9%80%ED%8C%8C%EA%B3%B0", desc: "[ 사남 ] 파곰뱃살통통 밈이 유명함." },
        { name: "재켄", color: "#90EE90", img: "재켄.png", yt: "https://www.youtube.com/@%EC%9D%BC%EB%A1%9C%EC%99%80%EB%B3%B4%EC%9D%B4", shortDesc: "[ 오남 ] 그림과 게임을 좋아함.", longDesc: ", 샌즈 캐릭터 등 다양한 그림을 그림." },
        { name: "오드", color: "#FFA500", img: "오드.png", yt: "https://www.youtube.com/@fake_od", desc: "[ 육남 ] 아랫집에 마지막 합류, 사운드트랙 제작." },
        { name: "김설띠", color: "#D8BFD8", img: "김설띠.png", yt: "https://www.youtube.com/@Kimsultye0110", desc: "장녀 / 유일한 여성 멤버, 리듬게임 고수." },
        { name: "고스", color: "#808080", img: "고스.png", yt: "https://www.youtube.com/@gos2017", desc: "[ 막내 ] 스키비디 토일렛과 SCP를 좋아함." },
        { name: "탈두", color: "#FFFF00", img: "탈두.png", yt: "https://www.youtube.com/@TALDUDA", desc: "[ 집나간 새끼 ] 현생에 집중 중." }
    ];

    const svg = document.getElementById('svg-lines');
    function drawLine(x1, y1, x2, y2) {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x1); line.setAttribute("y1", y1);
        line.setAttribute("x2", x2); line.setAttribute("y2", y2);
        line.setAttribute("stroke", "black"); line.setAttribute("stroke-width", "3");
        svg.appendChild(line);
    }
    drawLine(550, 125, 600, 125); drawLine(575, 125, 575, 250); drawLine(150, 250, 750, 250);
    drawLine(150, 250, 150, 300); drawLine(350, 250, 350, 300); drawLine(550, 250, 550, 300); drawLine(750, 250, 750, 300);

    const container = document.getElementById('member-container');
    members.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'member-btn';
        btn.style.background = `linear-gradient(to bottom, ${m.color}, #ffffff)`;
        btn.innerHTML = `<img src="${m.img}" alt="${m.name}"><span>${m.name}</span>`;
        btn.onclick = () => openModal(m);
        container.appendChild(btn);
    });

    function openModal(m) {
        document.getElementById('modal-img').src = m.img;
        document.getElementById('modal-name').innerText = m.name;
        const descElem = document.getElementById('modal-desc');
        if (m.name === "재켄") {
            descElem.innerHTML = m.shortDesc + '<span id="more-text" style="display:none;">' + m.longDesc + '</span><br><span class="read-more-btn" onclick="showFull()">...더보기</span>';
        } else { descElem.innerHTML = m.desc; }
        document.getElementById('modal-youtube').href = m.yt;
        document.getElementById('modal').style.display = 'flex';
    }
    function showFull() { document.getElementById('more-text').style.display = 'inline'; document.querySelector('.read-more-btn').style.display = 'none'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
</script>
</body>
</html>
