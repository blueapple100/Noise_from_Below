    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: sans-serif; 
            /* 그라데이션 배경 복원 */
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%); 
            min-height: 100vh; 
            -webkit-user-select: none; 
            user-select: none; 
            overflow-x: auto;
        }
        header { 
            padding: 20px; 
            background: linear-gradient(to right, #000000, #444444); 
            display: flex; 
            align-items: center; 
        }
        #logo { height: 50px; margin-right: 15px; }
        .menu-text { color: white; font-size: 20px; font-weight: bold; }
        
        /* 가계도 섹션 */
        #tree-section { 
            position: relative; 
            max-width: 1000px; 
            margin: 50px auto; 
            padding-bottom: 100px;
        }

        /* 멤버 박스 스타일 (원본 크기 반영) */
        .member-btn { 
            position: absolute;
            border: 3px solid white; /* 흰색 테두리 */
            padding: 0; 
            border-radius: 10px; 
            cursor: pointer; 
            overflow: hidden; 
            transition: transform 0.2s, box-shadow 0.2s; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            width: 100px; 
            height: 100px; /* 정사각형 고정 */
            z-index: 10;
        }
        .member-btn:hover { transform: scale(1.05); box-shadow: 0 8px 12px rgba(0,0,0,0.2); }
        .member-btn img { width: 100%; height: 100%; object-fit: cover; }

        /* 이름표 스타일 (원본 스타일 반영 - 박스 아래 위치) */
        .member-name {
            position: absolute;
            font-weight: bold;
            color: #333;
            font-size: 12px;
            text-align: center;
            width: 100px;
            z-index: 10;
        }

        /* 엄마 박스 스타일 (원본 반영) */
        #mom-box {
            position: absolute;
            width: 100px; height: 100px;
            border: 3px solid white; border-radius: 10px;
            background-color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: bold; color: #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 10;
        }

        /* 가계도 선 (SVG) (원본 굵기 반영) */
        #svg-lines { position:absolute; top:0; left:0; width:100%; height:100%; z-index: 1; }
        line { stroke: black; stroke-width: 5; } /* 두꺼운 선 */

        /* 모달 스타일 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; display: flex; gap: 20px; width: 80%; max-width: 600px; }
        .modal-img { width: 200px; height: 200px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
        .modal-text-area { max-height: 250px; overflow-y: auto; padding-right: 10px; }
        .read-more-btn { display: inline-block; margin-top: 5px; color: blue; cursor: pointer; font-size: 14px; text-decoration: underline; }
    </style>
</head>
